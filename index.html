<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top 5 Medal Icons</title>

<style>
  body {
    margin: 0;
    background: #f5f6f7;
    font-family: Arial, sans-serif;
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
    padding: 12px 16px;
    border-radius: 12px;
  }

  .name {
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="container" id="top5"></div>

<!-- SVG defs -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- leaf -->
    <g id="leaf">
      <path d="M0,-10 C6,-10 6,10 0,10 C-6,10 -6,-10 0,-10 Z"/>
    </g>
  </defs>
</svg>

<script>
function medalSVG(n, c){
  return `
  <svg width="80" viewBox="0 0 140 140">

    <!-- LAUREL -->
    <g fill="#5AA469">

      ${[0,0.15,0.3,0.45,0.6,0.75].map(o => `
        <use href="#leaf">
          <animateMotion dur="0s" fill="freeze"
            path="M30,100 A60,60 0 0,1 70,20"
            keyPoints="${o}" keyTimes="0"/>
        </use>
      `).join("")}

      ${[0,0.15,0.3,0.45,0.6,0.75].map(o => `
        <use href="#leaf">
          <animateMotion dur="0s" fill="freeze"
            path="M110,100 A60,60 0 0,0 70,20"
            keyPoints="${o}" keyTimes="0"/>
        </use>
      `).join("")}

      <!-- bottom leaves -->
      <use href="#leaf" transform="translate(50,115) rotate(60)"/>
      <use href="#leaf" transform="translate(70,120)"/>
      <use href="#leaf" transform="translate(90,115) rotate(-60)"/>

    </g>

    <!-- medal -->
    <defs>
      <radialGradient id="g${n}">
        <stop offset="0%" stop-color="${c.g1}"/>
        <stop offset="100%" stop-color="${c.g2}"/>
      </radialGradient>
    </defs>

    <circle cx="70" cy="70" r="42" fill="${c.outer}"/>
    <circle cx="70" cy="70" r="34" fill="url(#g${n})"/>
    <circle cx="70" cy="70" r="34" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>

    <text x="70" y="82"
      font-size="36"
      text-anchor="middle"
      font-weight="bold"
      fill="${c.tc}">
      ${n}
    </text>

  </svg>
  `;
}

// color config (ตรงภาพ)
const cfg = [
  { outer:'#F7D774', g1:'#FFE27A', g2:'#F5B700', tc:'#E08A2E' },
  { outer:'#D1D5DB', g1:'#E5E7EB', g2:'#9CA3AF', tc:'#4B5563' },
  { outer:'#FDBA74', g1:'#F6AD55', g2:'#DD6B20', tc:'#7B341E' },
  { outer:'#BEF264', g1:'#C6E377', g2:'#84CC16', tc:'#166534' },
  { outer:'#7DD3FC', g1:'#BAE6FD', g2:'#0284C7', tc:'#1E3A8A' }
];

// mock data
const data = [
  {name:"อันดับ 1"},
  {name:"อันดับ 2"},
  {name:"อันดับ 3"},
  {name:"อันดับ 4"},
  {name:"อันดับ 5"}
];

document.getElementById("top5").innerHTML =
  data.map((d,i)=>`
    <div class="item">
      ${medalSVG(i+1, cfg[i])}
      <div class="name">${d.name}</div>
    </div>
  `).join("");

</script>

</body>
</html>
